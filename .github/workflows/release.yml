name: Release

# Push a tag like v0.1.0 to build signed installers and the updater feed.
# The GitHub release is created as a draft so it can be checked before
# publishing; installed copies only see it once it is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Windows: MSI + setup.exe. Linux: .deb, .rpm and AppImage.
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers and updater feed
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (not a code-signing certificate). Add both as
          # repository secrets; see RELEASING.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Dace v__VERSION__
          releaseBody: See CHANGELOG.md for what changed in this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Update packages are only produced here, so local builds never
          # need the private key.
          args: --config src-tauri/tauri.release.conf.json
